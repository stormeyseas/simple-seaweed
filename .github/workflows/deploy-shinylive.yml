# Export the Shiny app with Shinylive (runs entirely in the browser via webR)
# and deploy the static site to GitHub Pages.
#
# Requirements:
#   * Repo Settings -> Pages -> Source must be "GitHub Actions".
#   * stormeyseas/macrogrow must have a GitHub release tagged MACROGROW_REF
#     with WebAssembly assets attached (built by its release-wasm workflow).
name: Deploy Shinylive app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; cancel superseded runs
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Release tag of stormeyseas/macrogrow to bundle with the app
  MACROGROW_REF: v1.1.1
  # This repo uses renv locally; don't let it activate on the runner
  RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
  # shinylive uses the GitHub API to find macrogrow's wasm release assets
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # shinylive inspects the locally installed copies of the app's packages
      # to resolve dependencies, so every package the app uses must be
      # installed here, including macrogrow at the pinned release tag.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            cran::shinylive
            cran::shiny
            cran::bslib
            cran::dplyr
            cran::tidyr
            cran::ggplot2
            cran::purrr
            cran::thematic
            github::stormeyseas/macrogrow@${{ env.MACROGROW_REF }}

      # Stage only the files the app needs (excludes renv/, .Rprofile, etc.)
      - name: Stage app files
        run: |
          mkdir -p _app
          cp -r app.R R data LICENSE _app/

      - name: Export app with shinylive
        shell: Rscript {0}
        run: shinylive::export("_app", "_site")

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
